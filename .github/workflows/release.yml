# ─────────────────────────────────────────────────────────────────────────────
# Publish the API image to GHCR.
#
# The production box is an OVH VPS-1 (2 vCore / 4 GB). Builds happen here rather
# than there for two reasons: the Angular build in the companion repo can peak
# well above what 4 GB leaves free beside a live MySQL, and building on the box
# means a `main` that does not compile takes production down with it. The VPS
# only ever does `docker compose pull && up -d`.
#
# Images are tagged with the commit SHA. Publishing one changes NOTHING live —
# rolling it out is a separate, manual act: run the "Deploy to production"
# workflow with the tag you want. Rollback is that same workflow with an older
# sha.
#
# NOTE: this repo is private, so published packages are private too. The VPS
# needs `docker login ghcr.io` with a PAT carrying read:packages.
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Top-level least-privilege default (LDA-M15); the build job re-grants the narrow
# packages:write it needs to publish to GHCR.
permissions:
  contents: read

concurrency:
  # Never let two releases race to publish `latest`.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api-image:
    name: Build & push lords-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase the owner — GHCR rejects uppercase in image names, and the
      # GitHub handle here is mixed-case.
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/lords-api" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### API image published"
            echo ''
            echo '```'
            echo "${{ steps.img.outputs.name }}:${{ github.sha }}"
            echo "${{ steps.img.outputs.name }}:latest"
            echo '```'
            echo ''
            echo 'Nothing live has changed. To roll this out, run the'
            echo '**Deploy to production** workflow with:'
            echo ''
            echo "    api_tag = ${{ github.sha }}"
            echo ''
            echo 'Pick the matching lords-web tag for `web_tag` — the SPA and the'
            echo 'API share a contract and must ship together.'
          } >> "$GITHUB_STEP_SUMMARY"
